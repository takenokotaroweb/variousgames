<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" width="160" height="60" shape-rendering="crispEdges">
<!-- 彗星(ver21、Claude 作図)。右へ進む向き。左へ進むときはゲームの中で左右反転して描く -->
<g fill="#C9B8FF">
<rect x="90" y="0" width="10" height="10"/>
<rect x="110" y="0" width="30" height="10"/>
<rect x="50" y="10" width="10" height="10"/>
<rect x="70" y="10" width="80" height="10"/>
<rect x="0" y="20" width="10" height="10"/>
<rect x="30" y="20" width="90" height="10"/>
<rect x="120" y="20" width="20" height="10" fill="#FFFFFF"/>
<rect x="140" y="20" width="20" height="10"/>
<rect x="10" y="30" width="20" height="10"/>
<rect x="40" y="30" width="80" height="10"/>
<rect x="120" y="30" width="20" height="10" fill="#FFFFFF"/>
<rect x="140" y="30" width="20" height="10"/>
<rect x="50" y="40" width="10" height="10"/>
<rect x="70" y="40" width="80" height="10"/>
<rect x="90" y="50" width="10" height="10"/>
<rect x="110" y="50" width="30" height="10"/>
</g>
</svg>
